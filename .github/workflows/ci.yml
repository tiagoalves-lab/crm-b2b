name: CI

on:
  push:
    # `master` é a branch real deste repo — `main` fica na lista só por
    # segurança caso o padrão mude. Ficou meses só com `main` aqui, o que
    # significava que NENHUM teste (inclusive os de RLS) rodava
    # automaticamente. Ver docs/seguranca.md, decisão 6.1.
    branches: [master, main]
  pull_request:

jobs:
  # Varredura de dependência vulnerável — o vetor mais comum de invasão
  # real num app Node, e o que faltava por completo até 2026-08-12.
  # Ver docs/seguranca.md, seção 7 (decisões 7.1 a 7.3) pro racional de
  # cada escolha abaixo, inclusive a dívida aceita e datada.
  #
  # --omit=dev: audita só o que vai pro servidor em produção. Ferramenta
  # de linha de comando que nunca é publicada (ex.: @railway/cli) não é
  # superfície de ataque do app — sem isso o gate travaria em CVE de
  # ferramenta de deploy, e gate que trava por ruído é gate que todo
  # mundo aprende a ignorar.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Auditar dependências do backend
        run: npm audit --omit=dev --audit-level=critical

      - name: Auditar dependências do frontend
        working-directory: web
        run: npm audit --omit=dev --audit-level=critical

  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: crm_user
          POSTGRES_PASSWORD: crm_password
          POSTGRES_DB: crm_b2b_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      # DIRECT_URL: papel superuser do container (crm_user) — só pra rodar
      # `prisma migrate deploy`. Nunca usado pela aplicação/testes.
      DIRECT_URL: postgresql://crm_user:crm_password@localhost:5432/crm_b2b_ci?schema=public
      # DATABASE_URL: placeholder até o papel `app_runtime` existir e
      # ganhar senha (step "Criar senha do papel app_runtime" abaixo
      # sobrescreve isso via $GITHUB_ENV, com um papel SEM BYPASSRLS —
      # ver docs/seguranca.md e prisma/migrations/*_app_runtime_role).
      DATABASE_URL: postgresql://crm_user:crm_password@localhost:5432/crm_b2b_ci?schema=public

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx prisma generate

      - run: npm run lint

      - run: npm run build

      # Cria tabelas + RLS + o papel app_runtime (SEM BYPASSRLS) — usa
      # DIRECT_URL (superuser), automaticamente, porque schema.prisma
      # declara `directUrl` no datasource.
      - run: npx prisma migrate deploy

      # RLS só prova alguma coisa testado com um papel que não a ignora.
      # Gera uma senha efêmera (só existe durante este job) pro papel
      # app_runtime criado pela migration, e aponta DATABASE_URL pra ele
      # — dali em diante os testes rodam sem privilégio de superusuário,
      # igual a aplicação vai rodar em produção.
      - name: Definir senha do papel app_runtime (efêmera, só deste job)
        run: |
          PASSWORD=$(openssl rand -hex 16)
          echo "::add-mask::$PASSWORD"
          PGPASSWORD=crm_password psql -h localhost -U crm_user -d crm_b2b_ci \
            -c "ALTER ROLE app_runtime WITH LOGIN PASSWORD '$PASSWORD';"
          echo "DATABASE_URL=postgresql://app_runtime:${PASSWORD}@localhost:5432/crm_b2b_ci?schema=public" >> "$GITHUB_ENV"

      - run: npm test

      - run: npm run test:e2e
