<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gama CRM — MVP</title>
<style>
  :root{
    /* Tema dark grafite (original) com accent azul da Gama (#052df4) no lugar do âmbar. */
    --steel-900:#14181d; --steel-800:#1c222a; --steel-700:#252d37;
    --steel-600:#323b47; --steel-500:#48525f; --steel-400:#6b7683;
    --line:#2c343e; --line-bright:#3d4855;
    --paper:#e8eaed; --paper-dim:#9ba4b0; --paper-faint:#6b7480;
    /* accent = azul Gama; mantém o nome --amber para não reescrever usos */
    --amber:#052df4; --amber-dim:#0423b8; --amber-glow:rgba(5,45,244,.16);
    --amber-text:#6f93ff;
    --brand:#052df4;
    --on-accent:#ffffff;
    --green:#3fb96b; --green-dim:rgba(63,185,107,.15);
    --blue:#4a9fe0; --blue-dim:rgba(74,159,224,.15);
    --purple:#9b7fe0; --purple-dim:rgba(155,127,224,.15);
    --red:#e05a4a; --red-dim:rgba(224,90,74,.15);
    --radius:6px;
    --mono:'JetBrains Mono','SF Mono',ui-monospace,'Cascadia Code',Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--steel-900);color:var(--paper);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
  ::selection{background:var(--amber-glow)}

  /* ---------- shell ---------- */
  .shell{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
  .sidebar{background:var(--steel-800);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
  .brand{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
  .brand-mark{width:28px;height:28px;border-radius:5px;background:linear-gradient(135deg,var(--brand),#3d8bff);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:700;color:var(--on-accent);font-size:15px;flex-shrink:0}
  .brand-name{font-family:var(--mono);font-weight:600;letter-spacing:.5px;font-size:15px}
  .brand-sub{font-family:var(--mono);font-size:9px;color:var(--paper-faint);letter-spacing:2px;text-transform:uppercase;margin-top:1px}
  .nav{padding:10px;flex:1;overflow-y:auto}
  .nav-label{font-family:var(--mono);font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--paper-faint);padding:14px 10px 6px}
  .nav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--radius);color:var(--paper-dim);cursor:pointer;font-size:13px;font-weight:500;transition:all .12s;border:1px solid transparent}
  .nav-item:hover{background:var(--steel-700);color:var(--paper)}
  .nav-item.active{background:var(--amber-glow);color:var(--amber-text);border-color:rgba(5,45,244,.35)}
  .nav-item .ic{width:16px;height:16px;flex-shrink:0}
  .nav-badge{margin-left:auto;font-family:var(--mono);font-size:10px;background:var(--steel-600);color:var(--paper-dim);padding:1px 6px;border-radius:8px}
  .nav-item.active .nav-badge{background:var(--amber);color:var(--on-accent)}
  .sidebar-foot{padding:14px;border-top:1px solid var(--line);display:flex;align-items:center;gap:10px}
  .avatar{width:30px;height:30px;border-radius:50%;background:var(--steel-600);border:1px solid var(--line-bright);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:11px;font-weight:600;color:var(--amber-text)}
  .who{font-size:12px;font-weight:600;line-height:1.2}
  .who-sub{font-size:10px;color:var(--paper-faint);font-family:var(--mono)}

  /* ---------- main ---------- */
  .main{overflow-y:auto;height:100vh}
  .topbar{padding:16px 28px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;background:rgba(20,24,29,.85);backdrop-filter:blur(8px);position:sticky;top:0;z-index:20}
  .page-title{font-size:18px;font-weight:600;letter-spacing:-.2px}
  .page-sub{font-size:12px;color:var(--paper-faint);font-family:var(--mono);margin-top:1px}
  .content{padding:24px 28px 60px}

  /* ---------- buttons ---------- */
  .btn{font-family:var(--sans);font-size:13px;font-weight:600;padding:8px 14px;border-radius:var(--radius);border:1px solid var(--line-bright);background:var(--steel-700);color:var(--paper);cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:all .12s;white-space:nowrap}
  .btn:hover{background:var(--steel-600);border-color:var(--steel-500)}
  .btn-primary{background:var(--amber);border-color:var(--amber);color:var(--on-accent)}
  .btn-primary:hover{background:#ffb92e;border-color:#ffb92e}
  .btn-ghost{background:transparent;border-color:transparent;color:var(--paper-dim)}
  .btn-ghost:hover{background:var(--steel-700);color:var(--paper)}
  .btn-danger:hover{background:var(--red-dim);border-color:var(--red);color:var(--red)}
  .btn-sm{padding:5px 10px;font-size:12px}
  .btn .ic{width:15px;height:15px}

  /* ---------- KPI cards ---------- */
  .kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}
  .kpi{background:var(--steel-800);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;position:relative;overflow:hidden}
  .kpi::before{content:'';position:absolute;top:0;left:0;width:3px;height:100%;background:var(--amber)}
  .kpi.blue::before{background:var(--blue)} .kpi.green::before{background:var(--green)} .kpi.purple::before{background:var(--purple)}
  .kpi-label{font-family:var(--mono);font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--paper-faint)}
  .kpi-value{font-size:26px;font-weight:700;letter-spacing:-.5px;margin-top:6px;font-variant-numeric:tabular-nums}
  .kpi-delta{font-family:var(--mono);font-size:11px;margin-top:4px;display:flex;align-items:center;gap:4px}
  .up{color:var(--green)} .down{color:var(--red)}

  /* ---------- panels ---------- */
  .panel{background:var(--steel-800);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:20px}
  .panel-head{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
  .panel-title{font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}
  .panel-title .ic{width:16px;height:16px;color:var(--amber)}
  .panel-body{padding:18px}

  /* ---------- pipeline board ---------- */
  .board{display:grid;gap:12px;overflow-x:auto}
  .board.b5{grid-template-columns:repeat(5,minmax(200px,1fr))}
  .board.b3{grid-template-columns:repeat(3,minmax(220px,1fr))}
  .board.b4{grid-template-columns:repeat(4,minmax(210px,1fr))}
  .col{background:var(--steel-900);border:1px solid var(--line);border-radius:var(--radius);min-height:120px;display:flex;flex-direction:column}
  .col.drag-over{border-color:var(--amber);box-shadow:0 0 0 1px var(--amber) inset}
  .col-head{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
  .col-head-top{display:flex;align-items:center;justify-content:space-between}
  .col-name{font-size:12px;font-weight:600;display:flex;align-items:center;gap:7px}
  .col-dot{width:8px;height:8px;border-radius:2px;flex-shrink:0}
  .col-count{font-family:var(--mono);font-size:10px;background:var(--steel-700);color:var(--paper-dim);padding:1px 7px;border-radius:8px}
  .col-sum{font-family:var(--mono);font-size:10px;color:var(--paper-faint)}
  .col-body{padding:10px;display:flex;flex-direction:column;gap:8px;flex:1}
  .card{background:var(--steel-800);border:1px solid var(--line-bright);border-radius:5px;padding:11px;cursor:grab;transition:all .12s;border-left:2px solid var(--amber)}
  .card:hover{border-color:var(--steel-500);transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.3)}
  .card:active{cursor:grabbing}
  .card.dragging{opacity:.4}
  .card-co{font-size:13px;font-weight:600;line-height:1.3}
  .card-prod{font-size:11px;color:var(--paper-dim);margin-top:3px;display:flex;align-items:center;gap:5px}
  .card-foot{display:flex;align-items:center;justify-content:space-between;margin-top:9px}
  .card-val{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--amber-text)}
  .card-badge{font-family:var(--mono);font-size:9px;padding:2px 6px;border-radius:4px;letter-spacing:.5px}
  .mini-avatar{width:20px;height:20px;border-radius:50%;background:var(--steel-600);border:1px solid var(--line-bright);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:9px;font-weight:600;color:var(--paper-dim)}
  .card-score{font-family:var(--mono);font-size:10px;padding:1px 6px;border-radius:4px;font-weight:600}
  .add-card{margin:0 10px 10px;padding:7px;border:1px dashed var(--line-bright);border-radius:5px;color:var(--paper-faint);font-size:11px;text-align:center;cursor:pointer;transition:all .12s}
  .add-card:hover{border-color:var(--amber);color:var(--amber)}

  /* ---------- tables ---------- */
  table{width:100%;border-collapse:collapse}
  thead th{text-align:left;font-family:var(--mono);font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--paper-faint);padding:10px 14px;border-bottom:1px solid var(--line);font-weight:500;white-space:nowrap}
  tbody td{padding:12px 14px;border-bottom:1px solid var(--line);font-size:13px}
  tbody tr{transition:background .1s}
  tbody tr:hover{background:var(--steel-700)}
  tbody tr:last-child td{border-bottom:none}
  .t-co{font-weight:600}
  .t-sub{font-size:11px;color:var(--paper-faint);font-family:var(--mono)}
  .cell-actions{display:flex;gap:4px;opacity:0;transition:opacity .1s}
  tr:hover .cell-actions{opacity:1}
  .icon-btn{width:28px;height:28px;border-radius:5px;border:1px solid var(--line);background:var(--steel-700);color:var(--paper-dim);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:all .12s}
  .icon-btn:hover{background:var(--steel-600);color:var(--paper)}
  .icon-btn.danger:hover{background:var(--red-dim);border-color:var(--red);color:var(--red)}
  .icon-btn .ic{width:14px;height:14px}

  /* ---------- pills ---------- */
  .pill{font-family:var(--mono);font-size:10px;font-weight:600;padding:3px 9px;border-radius:20px;letter-spacing:.5px;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
  .pill::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}
  .pill-green{background:var(--green-dim);color:var(--green)}
  .pill-blue{background:var(--blue-dim);color:var(--blue)}
  .pill-amber{background:var(--amber-glow);color:var(--amber-text)}
  .pill-purple{background:var(--purple-dim);color:var(--purple)}
  .pill-red{background:var(--red-dim);color:var(--red)}
  .pill-gray{background:var(--steel-600);color:var(--paper-dim)}

  /* ---------- kanban tarefas ---------- */
  .task-card{background:var(--steel-800);border:1px solid var(--line-bright);border-radius:5px;padding:10px;cursor:grab;transition:all .12s;border-top:2px solid var(--paper-faint)}
  .task-card:hover{border-color:var(--steel-500);transform:translateY(-1px)}
  .task-card.dragging{opacity:.4}
  .task-card.t-ligacao{border-top-color:var(--blue)}
  .task-card.t-email{border-top-color:var(--purple)}
  .task-card.t-visita{border-top-color:var(--amber)}
  .task-card.t-proposta{border-top-color:var(--green)}
  .task-card.t-followup{border-top-color:var(--red)}
  .task-title{font-size:12px;font-weight:600;line-height:1.35}
  .task-meta{display:flex;align-items:center;gap:6px;margin-top:8px;flex-wrap:wrap}
  .task-link{font-size:10px;color:var(--paper-dim);font-family:var(--mono);display:flex;align-items:center;gap:4px}
  .task-type{font-family:var(--mono);font-size:9px;text-transform:uppercase;letter-spacing:.5px;padding:1px 5px;border-radius:3px;background:var(--steel-700);color:var(--paper-dim)}
  .task-due{font-family:var(--mono);font-size:10px;margin-left:auto}
  .due-late{color:var(--red)} .due-today{color:var(--amber-text)} .due-ok{color:var(--paper-faint)}

  /* ---------- modal ---------- */
  .overlay{position:fixed;inset:0;background:rgba(10,12,15,.7);backdrop-filter:blur(3px);z-index:100;display:none;align-items:flex-start;justify-content:center;padding:60px 20px;overflow-y:auto}
  .overlay.open{display:flex}
  .modal{background:var(--steel-800);border:1px solid var(--line-bright);border-radius:8px;width:100%;max-width:520px;box-shadow:0 24px 60px rgba(0,0,0,.5);animation:pop .16s ease}
  @keyframes pop{from{transform:translateY(8px) scale(.98);opacity:0}to{transform:none;opacity:1}}
  .modal-head{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
  .modal-title{font-size:16px;font-weight:600}
  .modal-body{padding:22px}
  .modal-foot{padding:16px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px}
  .field{margin-bottom:16px}
  .field label{display:block;font-family:var(--mono);font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--paper-dim);margin-bottom:6px}
  .field input,.field select,.field textarea{width:100%;background:var(--steel-900);border:1px solid var(--line-bright);border-radius:var(--radius);padding:9px 12px;color:var(--paper);font-family:var(--sans);font-size:13px;transition:border .12s}
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--amber)}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .field-hint{font-size:11px;color:var(--paper-faint);margin-top:5px;font-family:var(--mono)}

  /* ---------- filters bar ---------- */
  .toolbar{display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap}
  .search{flex:1;min-width:200px;position:relative}
  .search input{width:100%;background:var(--steel-800);border:1px solid var(--line);border-radius:var(--radius);padding:9px 12px 9px 36px;color:var(--paper);font-size:13px}
  .search input:focus{outline:none;border-color:var(--line-bright)}
  .search .ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--paper-faint)}
  .seg{display:flex;background:var(--steel-800);border:1px solid var(--line);border-radius:var(--radius);padding:2px}
  .seg button{padding:6px 12px;font-size:12px;font-weight:600;border:none;background:transparent;color:var(--paper-dim);border-radius:4px;cursor:pointer;font-family:var(--sans)}
  .seg button.active{background:var(--steel-600);color:var(--paper)}

  /* ---------- reports ---------- */
  .report-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:20px}
  .funnel-bar{display:flex;flex-direction:column;gap:10px}
  .fbar{display:flex;align-items:center;gap:12px}
  .fbar-label{width:110px;font-size:12px;color:var(--paper-dim);text-align:right;flex-shrink:0}
  .fbar-track{flex:1;height:32px;background:var(--steel-900);border-radius:4px;overflow:hidden;position:relative;border:1px solid var(--line)}
  .fbar-fill{height:100%;background:linear-gradient(90deg,var(--brand),#3d8bff);display:flex;align-items:center;padding-left:10px;font-family:var(--mono);font-size:11px;font-weight:600;color:var(--on-accent);transition:width .5s ease}
  .fbar-val{width:70px;font-family:var(--mono);font-size:12px;color:var(--paper);flex-shrink:0}
  .bars{display:flex;align-items:flex-end;gap:14px;height:180px;padding-top:20px}
  .bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;height:100%;justify-content:flex-end}
  .bar{width:100%;max-width:44px;background:linear-gradient(180deg,#3d8bff,var(--brand));border-radius:4px 4px 0 0;position:relative;transition:height .5s ease;min-height:4px}
  .bar-v{position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-family:var(--mono);font-size:10px;color:var(--paper-dim);white-space:nowrap}
  .bar-l{font-family:var(--mono);font-size:10px;color:var(--paper-faint)}
  .donut-wrap{display:flex;align-items:center;gap:24px}
  .legend{display:flex;flex-direction:column;gap:10px}
  .leg-item{display:flex;align-items:center;gap:9px;font-size:12px}
  .leg-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0}
  .leg-val{font-family:var(--mono);color:var(--paper-dim);margin-left:auto}

  /* ---------- detail drawer ---------- */
  .kv{display:grid;grid-template-columns:120px 1fr;gap:10px 16px;font-size:13px}
  .kv dt{font-family:var(--mono);font-size:10px;letter-spacing:.5px;text-transform:uppercase;color:var(--paper-faint);padding-top:2px}
  .kv dd{color:var(--paper)}

  /* triagem */
  .triage-bulkbar{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--amber-glow);border:1px solid rgba(5,45,244,.3);border-radius:var(--radius);margin-bottom:16px}
  .triage-bulkbar.hidden{display:none}
  .score-cell{display:flex;align-items:center;gap:10px;min-width:150px}
  .score-mini{width:70px;height:6px;background:var(--steel-900);border-radius:3px;overflow:hidden;border:1px solid var(--line)}
  .score-mini-fill{height:100%;border-radius:3px}
  .tier-tag{font-family:var(--mono);font-size:9px;font-weight:600;padding:2px 7px;border-radius:4px;letter-spacing:.5px;text-transform:uppercase}
  .tier-quente{background:var(--green-dim);color:var(--green)}
  .tier-morno{background:var(--amber-glow);color:var(--amber-text)}
  .tier-frio{background:var(--red-dim);color:var(--red)}
  .checkcol{width:36px}
  .triage-row.picked{background:var(--amber-glow)}
  .score-why{font-size:11px;color:var(--paper-faint);cursor:help}
  .funnel-stat{display:flex;gap:20px;margin-bottom:18px;flex-wrap:wrap}
  .fstat{flex:1;min-width:120px;background:var(--steel-800);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;border-left:3px solid var(--paper-faint)}
  .fstat.q{border-left-color:var(--green)} .fstat.m{border-left-color:var(--amber)} .fstat.f{border-left-color:var(--red)}
  .fstat-v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
  .fstat-l{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--paper-faint);margin-top:2px}

  /* ficha da empresa (drawer full-height à direita) */
  .drawer-overlay{position:fixed;inset:0;background:rgba(10,12,15,.6);backdrop-filter:blur(2px);z-index:90;display:none}
  .drawer-overlay.open{display:block}
  .drawer{position:fixed;top:0;right:0;height:100vh;width:640px;max-width:92vw;background:var(--steel-900);border-left:1px solid var(--line-bright);z-index:95;transform:translateX(100%);transition:transform .22s ease;display:flex;flex-direction:column;box-shadow:-20px 0 50px rgba(0,0,0,.4)}
  .drawer.open{transform:translateX(0)}
  .drawer-head{padding:20px 24px;border-bottom:1px solid var(--line);background:var(--steel-800)}
  .drawer-head-top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
  .drawer-co-name{font-size:19px;font-weight:600;letter-spacing:-.3px;line-height:1.25}
  .drawer-co-meta{font-family:var(--mono);font-size:11px;color:var(--paper-faint);margin-top:4px}
  .drawer-tabs{display:flex;gap:2px;padding:0 24px;background:var(--steel-800);border-bottom:1px solid var(--line);overflow-x:auto}
  .drawer-tab{padding:11px 14px;font-size:13px;font-weight:500;color:var(--paper-dim);border:none;background:transparent;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;display:flex;align-items:center;gap:6px;font-family:var(--sans)}
  .drawer-tab:hover{color:var(--paper)}
  .drawer-tab.active{color:var(--amber-text);border-bottom-color:var(--amber)}
  .drawer-tab .tab-count{font-family:var(--mono);font-size:10px;background:var(--steel-600);color:var(--paper-dim);padding:1px 6px;border-radius:8px}
  .drawer-tab.active .tab-count{background:var(--amber);color:var(--on-accent)}
  .drawer-body{flex:1;overflow-y:auto;padding:22px 24px}
  .drawer-tabpane{display:none} .drawer-tabpane.active{display:block}

  /* timeline */
  .add-note{background:var(--steel-800);border:1px solid var(--line-bright);border-radius:8px;padding:14px;margin-bottom:20px}
  .add-note-types{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
  .note-type-btn{padding:5px 11px;font-size:12px;font-weight:500;border:1px solid var(--line-bright);background:var(--steel-900);color:var(--paper-dim);border-radius:20px;cursor:pointer;display:flex;align-items:center;gap:5px;transition:all .12s;font-family:var(--sans)}
  .note-type-btn:hover{border-color:var(--steel-500);color:var(--paper)}
  .note-type-btn.active{background:var(--amber-glow);border-color:var(--amber);color:var(--amber-text)}
  .note-type-btn .ic{width:13px;height:13px}
  .add-note textarea{width:100%;background:var(--steel-900);border:1px solid var(--line-bright);border-radius:6px;padding:10px;color:var(--paper);font-family:var(--sans);font-size:13px;resize:vertical;min-height:60px}
  .add-note textarea:focus{outline:none;border-color:var(--amber)}
  .add-note-foot{display:flex;justify-content:flex-end;margin-top:10px}

  .timeline{position:relative;padding-left:28px}
  .timeline::before{content:'';position:absolute;left:9px;top:6px;bottom:6px;width:2px;background:var(--line)}
  .tl-item{position:relative;margin-bottom:20px}
  .tl-item:last-child{margin-bottom:0}
  .tl-dot{position:absolute;left:-28px;top:0;width:20px;height:20px;border-radius:50%;background:var(--steel-800);border:2px solid var(--line-bright);display:flex;align-items:center;justify-content:center}
  .tl-dot .ic{width:11px;height:11px}
  .tl-head{display:flex;align-items:center;gap:8px;margin-bottom:5px;flex-wrap:wrap}
  .tl-type{font-family:var(--mono);font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;padding:1px 7px;border-radius:4px}
  .tl-author{font-size:12px;font-weight:600;color:var(--paper)}
  .tl-date{font-family:var(--mono);font-size:10px;color:var(--paper-faint);margin-left:auto}
  .tl-text{font-size:13px;color:var(--paper-dim);line-height:1.55;background:var(--steel-800);border:1px solid var(--line);border-radius:6px;padding:10px 12px}
  .tl-item.sistema .tl-text{background:transparent;border-style:dashed;color:var(--paper-faint);font-style:italic}

  /* mini list dentro das abas */
  .drawer-list-item{background:var(--steel-800);border:1px solid var(--line);border-radius:6px;padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .drawer-list-item:hover{border-color:var(--line-bright)}
  .dli-title{font-size:13px;font-weight:600}
  .dli-sub{font-size:11px;color:var(--paper-faint);font-family:var(--mono);margin-top:2px}
  .overview-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:22px}
  .ov-stat{background:var(--steel-800);border:1px solid var(--line);border-radius:6px;padding:12px 14px;border-left:3px solid var(--amber)}
  .ov-stat.blue{border-left-color:var(--blue)} .ov-stat.green{border-left-color:var(--green)} .ov-stat.purple{border-left-color:var(--purple)}
  .ov-stat-l{font-family:var(--mono);font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--paper-faint)}
  .ov-stat-v{font-size:19px;font-weight:700;margin-top:3px;font-variant-numeric:tabular-nums}
  .drawer-section-title{font-family:var(--mono);font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--paper-faint);margin:22px 0 12px;display:flex;align-items:center;gap:8px}
  .drawer-section-title::after{content:'';flex:1;height:1px;background:var(--line)}
  .posvenda-empty{text-align:center;padding:30px;color:var(--paper-faint);border:1px dashed var(--line-bright);border-radius:8px}
  .posvenda-empty .ic{width:28px;height:28px;margin:0 auto 10px;opacity:.5}

  .row-clickable{cursor:pointer}
  .row-clickable:hover .t-co{color:var(--amber)}

  /* dados cadastrais */
  .cnpj-search{background:var(--steel-800);border:1px solid var(--line-bright);border-radius:8px;padding:16px;margin-bottom:20px}
  .cnpj-search-row{display:flex;gap:10px;align-items:flex-end}
  .cnpj-search .field{margin:0;flex:1}
  .cad-source{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:10px;color:var(--paper-faint);margin-bottom:14px;padding:7px 11px;background:var(--green-dim);border-radius:5px;border:1px solid rgba(63,185,107,.25)}
  .cad-source.estadual{background:var(--amber-glow);border-color:rgba(5,45,244,.25)}
  .cad-source .ic{width:13px;height:13px;color:var(--green)}
  .cad-source.estadual .ic{color:var(--amber)}
  .cad-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:8px}
  .cad-cell{background:var(--steel-800);padding:11px 14px}
  .cad-cell.full{grid-column:1/-1}
  .cad-k{font-family:var(--mono);font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--paper-faint)}
  .cad-v{font-size:13px;color:var(--paper);margin-top:3px;line-height:1.4}
  .cad-v.mono{font-family:var(--mono);font-size:12px}
  .cnae-list{display:flex;flex-direction:column;gap:4px;margin-top:4px}
  .cnae-chip{font-size:11px;color:var(--paper-dim);background:var(--steel-900);border:1px solid var(--line);border-radius:4px;padding:3px 8px;display:inline-block;width:fit-content}
  .cad-empty{text-align:center;padding:34px 20px;border:1px dashed var(--line-bright);border-radius:8px}
  .cad-empty .ic{width:30px;height:30px;margin:0 auto 12px;opacity:.5;color:var(--paper-faint)}
  .cad-empty p{font-size:13px;color:var(--paper-dim);margin-bottom:16px;max-width:340px;margin-left:auto;margin-right:auto}
  .spin{animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .badge-contrib{font-family:var(--mono);font-size:10px;font-weight:600;padding:2px 8px;border-radius:4px}
  .badge-contrib.sim{background:var(--green-dim);color:var(--green)}
  .badge-contrib.nao{background:var(--steel-600);color:var(--paper-dim)}

  /* dados cadastrais */
  /* tarefas: tabela */
  .task-type-dot{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:7px;vertical-align:middle}
  .task-check{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--line-bright);background:var(--steel-900);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:all .12s}
  .task-check:hover{border-color:var(--amber)}
  .task-check.done{background:var(--green);border-color:var(--green)}
  .task-check.done .ic{width:12px;height:12px;color:var(--steel-900)}
  .task-title-cell{font-weight:500}
  .task-title-cell.done{text-decoration:line-through;color:var(--paper-faint)}
  .attach-count{font-family:var(--mono);font-size:10px;color:var(--paper-faint);display:inline-flex;align-items:center;gap:3px;margin-left:8px}
  .attach-count .ic{width:12px;height:12px}

  /* tarefas: calendário */
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
  .cal-title{font-size:16px;font-weight:600}
  .cal-nav{display:flex;gap:6px}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
  .cal-dow{font-family:var(--mono);font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--paper-faint);text-align:center;padding-bottom:6px}
  .cal-cell{background:var(--steel-800);border:1px solid var(--line);border-radius:6px;min-height:96px;padding:7px;display:flex;flex-direction:column;gap:4px;overflow:hidden}
  .cal-cell.other-month{opacity:.35}
  .cal-cell.today{border-color:var(--amber);box-shadow:0 0 0 1px var(--amber) inset}
  .cal-daynum{font-family:var(--mono);font-size:11px;color:var(--paper-dim);font-weight:600}
  .cal-cell.today .cal-daynum{color:var(--amber-text)}
  .cal-task{font-size:10px;padding:3px 6px;border-radius:4px;background:var(--steel-700);border-left:2px solid var(--paper-faint);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:all .1s}
  .cal-task:hover{background:var(--steel-600)}
  .cal-task.done{opacity:.5;text-decoration:line-through}
  .cal-more{font-size:9px;color:var(--paper-faint);font-family:var(--mono);cursor:pointer}

  /* detalhe da tarefa: anexos + chat */
  .task-detail-section{margin-top:22px}
  .attach-drop{border:1.5px dashed var(--line-bright);border-radius:8px;padding:16px;text-align:center;cursor:pointer;transition:all .12s;margin-bottom:12px}
  .attach-drop:hover{border-color:var(--amber);background:var(--amber-glow)}
  .attach-drop .ic{width:22px;height:22px;color:var(--paper-faint);margin-bottom:6px}
  .attach-drop-text{font-size:12px;color:var(--paper-dim)}
  .attach-item{display:flex;align-items:center;gap:11px;background:var(--steel-800);border:1px solid var(--line);border-radius:6px;padding:9px 12px;margin-bottom:7px}
  .attach-icon{width:34px;height:34px;border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .attach-icon.pdf{background:var(--red-dim);color:var(--red)}
  .attach-icon.imagem{background:var(--purple-dim);color:var(--purple)}
  .attach-icon.planilha{background:var(--green-dim);color:var(--green)}
  .attach-icon.outro{background:var(--steel-600);color:var(--paper-dim)}
  .attach-icon .ic{width:17px;height:17px}
  .attach-info{flex:1;min-width:0}
  .attach-name{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .attach-meta{font-family:var(--mono);font-size:10px;color:var(--paper-faint);margin-top:1px}

  .chat-thread{display:flex;flex-direction:column;gap:12px;margin-bottom:14px}
  .chat-msg{display:flex;gap:10px}
  .chat-avatar{width:28px;height:28px;border-radius:50%;background:var(--steel-600);border:1px solid var(--line-bright);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:10px;font-weight:600;color:var(--amber-text);flex-shrink:0}
  .chat-bubble{flex:1;background:var(--steel-800);border:1px solid var(--line);border-radius:8px;border-top-left-radius:2px;padding:9px 12px}
  .chat-msg-head{display:flex;align-items:center;gap:8px;margin-bottom:3px}
  .chat-author{font-size:12px;font-weight:600}
  .chat-time{font-family:var(--mono);font-size:10px;color:var(--paper-faint);margin-left:auto}
  .chat-text{font-size:13px;color:var(--paper-dim);line-height:1.5}
  .chat-input-row{display:flex;gap:8px;align-items:flex-end}
  .chat-input-row textarea{flex:1;background:var(--steel-900);border:1px solid var(--line-bright);border-radius:8px;padding:9px 12px;color:var(--paper);font-family:var(--sans);font-size:13px;resize:none;min-height:40px}
  .chat-input-row textarea:focus{outline:none;border-color:var(--amber)}
  .chat-empty{text-align:center;padding:20px;color:var(--paper-faint);font-size:12px}

  /* tarefas: tabela */
  /* subform oportunidades encerradas */
  .closed-section{margin-top:28px;border-top:1px solid var(--line);padding-top:20px}
  .closed-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .closed-title{font-family:var(--mono);font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--paper-faint)}
  .closed-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
  .closed-card{border-radius:8px;padding:12px 14px;border:1px solid;border-left-width:3px;cursor:pointer;transition:all .12s}
  .closed-card:hover{transform:translateY(-1px)}
  .closed-card.ganho{background:var(--blue-dim);border-color:rgba(61,139,255,.3);border-left-color:var(--blue)}
  .closed-card.perdido{background:var(--red-dim);border-color:rgba(224,90,74,.3);border-left-color:var(--red)}
  .closed-card-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:5px}
  .closed-co{font-size:13px;font-weight:600}
  .closed-tag{font-family:var(--mono);font-size:9px;font-weight:600;padding:2px 7px;border-radius:4px;letter-spacing:.5px;text-transform:uppercase}
  .closed-tag.ganho{background:var(--blue);color:#fff}
  .closed-tag.perdido{background:var(--red);color:#fff}
  .closed-prod{font-size:11px;color:var(--paper-dim);margin-bottom:6px}
  .closed-foot{display:flex;align-items:center;justify-content:space-between}
  .closed-val{font-family:var(--mono);font-size:13px;font-weight:600}
  .closed-val.ganho{color:var(--blue)}
  .closed-val.perdido{color:var(--red)}
  .closed-motivo{font-size:10px;color:var(--red);font-style:italic}

  /* subform oportunidades encerradas */
  /* filtro de período do subform */
  .period-filter{display:flex;align-items:center;gap:8px;margin-left:auto}
  .period-nav{display:flex;align-items:center;gap:2px;background:var(--steel-800);border:1px solid var(--line);border-radius:var(--radius);padding:2px}
  .period-arrow{width:28px;height:26px;border:none;background:transparent;color:var(--paper-dim);cursor:pointer;border-radius:4px;display:flex;align-items:center;justify-content:center;transition:all .12s}
  .period-arrow:hover{background:var(--steel-600);color:var(--paper)}
  .period-label{font-size:13px;font-weight:500;min-width:110px;text-align:center;color:var(--paper);padding:0 4px}
  .period-custom-btn{width:30px;height:30px;border:1px solid var(--line-bright);background:var(--amber);color:var(--on-accent);border-radius:var(--radius);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .12s}
  .period-custom-btn:hover{background:#0740ff}
  .period-custom-btn.active{background:var(--amber-dim)}
  .period-range{display:flex;align-items:center;gap:8px;background:var(--steel-800);border:1px solid var(--line-bright);border-radius:var(--radius);padding:6px 10px;margin-bottom:14px}
  .period-range.hidden{display:none}
  .period-range label{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--paper-faint)}
  .period-range input{background:var(--steel-900);border:1px solid var(--line-bright);border-radius:5px;padding:5px 8px;color:var(--paper);font-size:12px;font-family:var(--sans)}
  .period-range input:focus{outline:none;border-color:var(--amber)}
  .closed-summary{display:flex;gap:16px;margin-bottom:14px;flex-wrap:wrap}
  .cs-stat{font-size:12px;color:var(--paper-dim)}
  .cs-stat b{font-family:var(--mono);font-size:14px}

  /* filtro de período do subform */
  /* seletor de empresa unificado (empresas + leads) */
  .co-picker{position:relative}
  .co-picker-selected{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--steel-800);border:1px solid var(--amber);border-radius:var(--radius)}
  .co-picker-selected .co-nome{font-weight:600;font-size:13px}
  .co-picker-selected .co-tag{font-family:var(--mono);font-size:9px;font-weight:600;padding:2px 7px;border-radius:4px;text-transform:uppercase}
  .co-tag.empresa{background:var(--green-dim);color:var(--green)}
  .co-tag.lead{background:var(--blue-dim);color:var(--amber-text)}
  .co-tag.nova{background:var(--amber-glow);color:var(--amber-text)}
  .co-picker-clear{margin-left:auto;cursor:pointer;color:var(--paper-faint);background:none;border:none;padding:4px}
  .co-picker-clear:hover{color:var(--red)}
  .co-results{border:1px solid var(--line-bright);border-radius:var(--radius);margin-top:6px;max-height:230px;overflow-y:auto;background:var(--steel-800)}
  .co-result{display:flex;align-items:center;gap:10px;padding:9px 12px;cursor:pointer;border-bottom:1px solid var(--line);transition:background .1s}
  .co-result:last-child{border-bottom:none}
  .co-result:hover{background:var(--steel-600)}
  .co-result-info{flex:1;min-width:0}
  .co-result-nome{font-size:13px;font-weight:500}
  .co-result-sub{font-size:11px;color:var(--paper-faint);font-family:var(--mono)}
  .co-result-none{padding:16px 12px;text-align:center}
  .co-result-none p{font-size:12px;color:var(--paper-dim);margin-bottom:10px}
  .co-cnpj-box{padding:12px;border-top:1px solid var(--line);background:var(--steel-900)}

  /* seletor de empresa unificado */
  .empty{text-align:center;padding:40px;color:var(--paper-faint)}
  .empty .ic{width:32px;height:32px;margin:0 auto 12px;opacity:.4}

  .view{display:none}
  .view.active{display:block}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--steel-700);border:1px solid var(--line-bright);border-left:3px solid var(--green);padding:12px 20px;border-radius:var(--radius);font-size:13px;font-weight:500;box-shadow:0 12px 30px rgba(0,0,0,.4);z-index:200;transition:transform .25s ease;display:flex;align-items:center;gap:10px}
  .toast.show{transform:translateX(-50%) translateY(0)}
  .toast .ic{width:16px;height:16px;color:var(--green)}

  @media(max-width:1100px){.kpi-row{grid-template-columns:repeat(2,1fr)}.report-grid{grid-template-columns:1fr}}
  @media(max-width:720px){.shell{grid-template-columns:1fr}.sidebar{display:none}}
</style>
</head>
<body>
<div class="shell">
  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">G</div>
      <div>
        <div class="brand-name">GAMA</div>
        <div class="brand-sub">CRM · MVP</div>
      </div>
    </div>
    <nav class="nav">
      <div class="nav-label">Comercial</div>
      <div class="nav-item active" data-view="dashboard" onclick="nav(this)">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>
        Painel
      </div>
      <div class="nav-item" data-view="triagem" onclick="nav(this)">

        <span class="nav-badge" id="badge-triagem">0</span>

        <span class="nav-badge" id="badge-prop">0</span>

        <span class="nav-badge" id="badge-cli">0</span>
      </div>
      <div class="nav-label">Análise</div>
      <div class="nav-item" data-view="relatorios" onclick="nav(this)">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><rect x="7" y="10" width="3" height="7"/><rect x="12" y="6" width="3" height="11"/><rect x="17" y="13" width="3" height="4"/></svg>
        Relatórios
      </div>
    </nav>
    <div class="sidebar-foot">
      <div class="avatar">TF</div>
      <div>
        <div class="who">Tiago F.</div>
        <div class="who-sub">Representante</div>
      </div>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="main">
    <div class="topbar">
      <div>
        <div class="page-title" id="pageTitle">Painel comercial</div>
        <div class="page-sub" id="pageSub">Visão geral da carteira</div>
      </div>
      <div id="topActions"></div>
    </div>
    <div class="content">
      <div id="view-dashboard" class="view active"></div>
      <div id="view-triagem" class="view"></div>
      <div id="view-propostas" class="view"></div>
      <div id="view-tarefas" class="view"></div>
      <div id="view-clientes" class="view"></div>
      <div id="view-relatorios" class="view"></div>
    </div>
  </main>
</div>

<!-- DRAWER FICHA DA EMPRESA -->
<div class="drawer-overlay" id="drawerOverlay" onclick="closeFicha()"></div>
<div class="drawer" id="drawer">
  <div class="drawer-head" id="drawerHead"></div>
  <div class="drawer-tabs" id="drawerTabs"></div>
  <div class="drawer-body" id="drawerBody"></div>
</div>

<!-- MODAL -->
<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-title" id="modalTitle">Novo registro</div>

  // CNAE aderente (divisões 25–30 = metalmecânica alvo)
  const div=parseInt((r.cnae||'').slice(0,2),10);
  if(div>=25 && div<=30){ s+=40; reasons.push('CNAE alvo (25–30) +40'); }
  else if(div===24){ s+=20; reasons.push('CNAE metalurgia próxima +20'); }
  else { reasons.push('CNAE fora do alvo +0'); }
  // Importador (Comex Stat) — sinal forte de capital
  if(r.importador){ s+=25; reasons.push('Importa via Comex Stat +25'); }
  else { reasons.push('Não importa +0'); }
  // Porte
  if(r.porte==='GRANDE'){ s+=20; reasons.push('Porte grande +20'); }
  else if(r.porte==='MÉDIO'){ s+=13; reasons.push('Porte médio +13'); }
  else { s+=5; reasons.push('Porte pequeno +5'); }
  // Situação cadastral ativa
  if(r.situacao==='ATIVA'){ s+=10; reasons.push('Situação ativa +10'); }
  else { s-=20; reasons.push('Situação irregular −20'); }
  // Região RS (todos são, mas mantém a lógica explícita)
  if(r.uf==='RS'){ s+=5; reasons.push('Região RS +5'); }
  return { score:Math.max(0,Math.min(100,s)), reasons };
}
function scoreTier(s){ if(s>=70)return 'quente'; if(s>=45)return 'morno'; return 'frio'; }

function triageRows(scored,search=''){
  let rows=scored;
  if(triageFilter!=='todos') rows=rows.filter(r=>scoreTier(r.score)===triageFilter);
  if(search) rows=rows.filter(r=>(r.razao+r.cnae+r.cnaeDesc).toLowerCase().includes(search.toLowerCase()));
  rows=rows.sort((a,b)=>b.score-a.score);
  if(!rows.length) return '<tr><td colspan="7" class="empty">Nenhum lead nesta faixa 🎯</td></tr>';
  const tierColor={quente:'var(--green)',morno:'var(--amber)',frio:'var(--red)'};
  return rows.map(r=>{
    const tier=scoreTier(r.score);
    return `<tr class="triage-row ${triagePicked.has(r.id)?'picked':''}" data-id="${r.id}">
      <td class="checkcol" onclick="event.stopPropagation()"><input type="checkbox" ${triagePicked.has(r.id)?'checked':''} onclick="togglePick(${r.id})"></td>
      <td class="row-clickable" onclick="openLeadFicha(${r.id})"><div class="t-co">${r.razao}</div><div class="t-sub">${r.cnpj} · ${r.municipio}/${r.uf}${r.situacao!=='ATIVA'?' · <span style=\"color:var(--red)\">'+r.situacao+'</span>':''}</div></td>

          <div class="score-mini"><div class="score-mini-fill" style="width:${r.score}%;background:${tierColor[tier]}"></div></div>
          <span class="score-why" title="${r.reasons.join(' · ')}">ⓘ</span>
        </div>
      </td>
      <td style="text-align:right"><div style="display:inline-flex;gap:4px">
        <button class="icon-btn" title="Abrir ficha (tarefas e histórico)" onclick="openLeadFicha(${r.id})"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><path d="M15 3h6v6M10 14L21 3"/></svg></button>
        <button class="icon-btn" title="Aprovar" onclick="approveRaw(${r.id})"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="var(--green)" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg></button>

      </div></td>
    </tr>`;
  }).join('');
}

function promoteRawToCompany(r){
  const sc=scoreRaw(r);
  const newId=nextId();
  DB.clientes.push({
    id:newId, razao:r.razao, cnpj:r.cnpj, contato:'—', fone:'—',
    cidade:`${r.municipio}/${r.uf}`, status:'negociando', ltv:0, ultimaCompra:'—',
    origemScore:sc.score, origemFonte:r.fonte,
    cad:{cnaePrincipal:r.cnae+' / '+(r.cnaeDesc||''), situacao:r.situacao, porte:r.porte, importador:r.importador, municipioUF:`${r.municipio}/${r.uf}`, fonteFederal:'—', buscadoEm:null, cnaeSecundarios:[], ie:null, contribuinteIcms:false, ieSituacao:null}
  });
  // ── Carrega o histórico feito na fase de LEAD para a empresa ──
  // No protótipo o lead usa companyId virtual (90000+id); reassociamos à empresa nova.
  const leadVirtualCid=90000+r.id;
  let migradas=0;
  DB.interactions.forEach(i=>{ if(i.companyId===leadVirtualCid){ i.companyId=newId; migradas++; } });
  // Tarefas do lead passam a apontar para a empresa (mantêm-se no board)
  DB.tasks.forEach(t=>{ if(t.vinculoTipo==='lead' && t.vinculoId===r.id){ t.vinculoTipo='oportunidade'; t.vinculoId=newId; t.vinculoNome=r.razao; } });
  // registra a origem na timeline
  DB.interactions.push({id:nextId(), companyId:newId, tipo:'sistema', autor:'Sistema', data:'2026-07-29T09:00',
    texto:`Lead aprovado na triagem · score ${sc.score} (${scoreTier(sc.score)}) · origem ${r.fonte}.${migradas?' Histórico de '+migradas+' contato(s) da fase de lead preservado.':''}`});
  return newId;
}
function approveRaw(id){
  const r=DB.rawLeads.find(x=>x.id===id); if(!r)return;
  r.status='aprovado';
  promoteRawToCompany(r);
  triagePicked.delete(id); renderTriagem(); updateBadges(); toast('✓ Lead aprovado — virou empresa, com histórico e tarefas preservados');
}
function discardRaw(id){ const r=DB.rawLeads.find(x=>x.id===id); if(r)r.status='descartado'; triagePicked.delete(id); renderTriagem(); updateBadges(); toast('Lead descartado (fica na staging)'); }
function bulkApprove(){
  const ids=[...triagePicked]; let n=0;
  ids.forEach(id=>{ const r=DB.rawLeads.find(x=>x.id===id); if(r&&r.status==='novo'){ r.status='aprovado'; promoteRawToCompany(r); n++; } });
  triagePicked.clear(); renderTriagem(); updateBadges(); toast(`✓ ${n} lead(s) viraram empresas com histórico`);
}
function bulkDiscard(){ const ids=[...triagePicked]; let n=0; ids.forEach(id=>{ const r=DB.rawLeads.find(x=>x.id===id); if(r&&r.status==='novo'){ r.status='descartado'; n++; } }); triagePicked.clear(); renderTriagem(); updateBadges(); toast(`${n} lead(s) descartado(s)`); }

/* ---- filtro de período do subform ---- */
let closedPeriod={modo:'mes', ano:2026, mes:6, ini:'2026-07-01', fim:'2026-07-31'}; // padrão: julho (mês corrente)
const MESES_CURTO=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
function renderPeriodFilter(){
  if(closedPeriod.modo==='mes'){
    return `<div class="period-filter">
      <div class="period-nav">
        <button class="period-arrow" onclick="closedMonthMove(-1)" title="Mês anterior"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px"><path d="M15 18l-6-6 6-6"/></svg></button>
        <span class="period-label">${MESES[closedPeriod.mes]} ${closedPeriod.ano}</span>
        <button class="period-arrow" onclick="closedMonthMove(1)" title="Próximo mês"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px"><path d="M9 18l6-6-6-6"/></svg></button>
      </div>
      <button class="period-custom-btn" onclick="closedToggleCustom()" title="Personalizar período"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:15px;height:15px"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg></button>
    </div>`;
  } else {
    return `<div class="period-filter">
      <span class="period-label" style="min-width:auto;font-family:var(--mono);font-size:11px;color:var(--paper-faint)">período personalizado</span>
      <button class="period-custom-btn active" onclick="closedToggleCustom()" title="Voltar para navegação mensal"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:15px;height:15px"><path d="M3 12h18M3 6h18M3 18h18"/></svg></button>
    </div>`;
  }
}
function renderClosedContent(){
  const el=$('#closedContent'); if(!el)return;
  // define intervalo [ini, fim]
  let ini, fim;
  if(closedPeriod.modo==='mes'){
    const mm=String(closedPeriod.mes+1).padStart(2,'0');
    const ultimoDia=new Date(closedPeriod.ano, closedPeriod.mes+1, 0).getDate();
    ini=`${closedPeriod.ano}-${mm}-01`;
    fim=`${closedPeriod.ano}-${mm}-${String(ultimoDia).padStart(2,'0')}`;
  } else {
    ini=closedPeriod.ini; fim=closedPeriod.fim;
  }
  const encerradas=DB.deals.filter(d=>d.stage.startsWith('fechado') && d.encerradoEm && d.encerradoEm>=ini && d.encerradoEm<=fim)
    .sort((a,b)=>b.encerradoEm.localeCompare(a.encerradoEm));
  const ganhas=encerradas.filter(d=>d.stage==='fechado_ganho');
  const perdidas=encerradas.filter(d=>d.stage==='fechado_perdido');
  const valGanho=ganhas.reduce((s,d)=>s+d.valor,0);
  const taxaPeriodo=encerradas.length?Math.round(ganhas.length/encerradas.length*100):0;

  const rangeInputs=closedPeriod.modo==='custom'?`
    <div class="period-range">
      <label>De</label><input type="date" value="${closedPeriod.ini}" onchange="closedSetRange('ini',this.value)">
      <label>Até</label><input type="date" value="${closedPeriod.fim}" onchange="closedSetRange('fim',this.value)">
    </div>`:'';

  const closedCards=encerradas.map(d=>{
    const won=d.stage==='fechado_ganho';
    const cls=won?'ganho':'perdido';
    return `<div class="closed-card ${cls}" onclick="openDealDetail(${d.id})">
      <div class="closed-card-top">
        <span class="closed-co">${d.cliente}</span>
        <span class="closed-tag ${cls}">${won?'Fechada':'Perdida'}</span>
      </div>
      <div class="closed-prod">🔧 ${d.produto} · ${fmtDate(d.encerradoEm)}</div>
      <div class="closed-foot">
        <span class="closed-val ${cls}">${brlFull(d.valor)}</span>
        ${!won&&d.motivo?`<span class="closed-motivo">${d.motivo}</span>`:''}
      </div>
    </div>`;
  }).join('');

  el.innerHTML=`
    ${rangeInputs}
    <div class="closed-summary">
      <span class="cs-stat">Encerradas: <b>${encerradas.length}</b></span>
      <span class="cs-stat" style="color:var(--blue)">Fechadas: <b>${ganhas.length}</b></span>
      <span class="cs-stat" style="color:var(--red)">Perdidas: <b>${perdidas.length}</b></span>
      <span class="cs-stat" style="color:var(--green)">Ganho no período: <b>${brl(valGanho)}</b></span>
      <span class="cs-stat">Taxa de fechamento: <b>${taxaPeriodo}%</b></span>
    </div>
    <div class="closed-grid">
      ${closedCards||'<p style="font-size:13px;color:var(--paper-faint)">Nenhuma oportunidade encerrada neste período.</p>'}
    </div>`;
}
function closedMonthMove(dir){
  let {ano,mes}=closedPeriod; mes+=dir;
  if(mes<0){mes=11;ano--;} if(mes>11){mes=0;ano++;}
  closedPeriod.ano=ano; closedPeriod.mes=mes;
  // atualiza o label e o conteúdo
  const head=document.querySelector('.closed-head .period-filter');
  if(head) head.outerHTML=renderPeriodFilter();
  renderClosedContent();
}
function closedToggleCustom(){
  if(closedPeriod.modo==='mes'){
    // ao entrar no custom, inicializa o range com o mês atual
    const mm=String(closedPeriod.mes+1).padStart(2,'0');
    const ultimoDia=new Date(closedPeriod.ano, closedPeriod.mes+1, 0).getDate();
    closedPeriod.ini=`${closedPeriod.ano}-${mm}-01`;
    closedPeriod.fim=`${closedPeriod.ano}-${mm}-${String(ultimoDia).padStart(2,'0')}`;
    closedPeriod.modo='custom';
  } else {
    closedPeriod.modo='mes';
  }
  const head=document.querySelector('.closed-head .period-filter');
  if(head) head.outerHTML=renderPeriodFilter();
  renderClosedContent();
}
function closedSetRange(campo,valor){
  closedPeriod[campo]=valor;
  renderClosedContent();
}

/* ---- LAYOUT CALENDÁRIO ---- */
const MESES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
function renderTaskCalendar(){
  const {ano,mes}=calRef;
  const primeiro=new Date(ano,mes,1);
  const inicioSemana=primeiro.getDay(); // 0=dom
  const diasNoMes=new Date(ano,mes+1,0).getDate();
  const hoje='2026-07-29';
  const dow=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];

  // agrupa tarefas por data (YYYY-MM-DD)
  const porDia={};
  DB.tasks.forEach(t=>{ (porDia[t.prazo]=porDia[t.prazo]||[]).push(t); });

  let cells='';
  // dias do mês anterior (preenchimento)
  for(let i=0;i<inicioSemana;i++) cells+=`<div class="cal-cell other-month"></div>`;
  for(let d=1;d<=diasNoMes;d++){
    const iso=`${ano}-${String(mes+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const dayTasks=porDia[iso]||[];
    const isToday=iso===hoje;
    const shown=dayTasks.slice(0,3);
    const extra=dayTasks.length-shown.length;
    cells+=`<div class="cal-cell ${isToday?'today':''}">
      <div class="cal-daynum">${d}</div>
      ${shown.map(t=>{
        const it=DB.interactionTypes[t.tipo]||{cor:'#6b7480'};
        return `<div class="cal-task ${t.status==='concluida'?'done':''}" style="border-left-color:${it.cor}" onclick="openTaskDetail(${t.id})" title="${t.titulo}">${t.titulo}</div>`;
      }).join('')}
      ${extra>0?`<div class="cal-more" onclick="setTaskView('tabela')">+${extra} mais</div>`:''}
    </div>`;
  }

  return `
    <div class="panel">
      <div class="panel-body">
        <div class="cal-head">
          <div class="cal-title">${MESES[mes]} ${ano}</div>
          <div class="cal-nav">
            <button class="btn btn-sm" onclick="calMove(-1)">‹ anterior</button>
            <button class="btn btn-sm" onclick="calHoje()">hoje</button>
            <button class="btn btn-sm" onclick="calMove(1)">próximo ›</button>
          </div>
        </div>
        <div class="cal-grid">
          ${dow.map(d=>`<div class="cal-dow">${d}</div>`).join('')}
          ${cells}
        </div>
      </div>
    </div>`;
}
function calMove(dir){
  let {ano,mes}=calRef; mes+=dir;
  if(mes<0){mes=11;ano--;} if(mes>11){mes=0;ano++;}
  calRef={ano,mes}; renderTarefas();
}
function calHoje(){ calRef={ano:2026,mes:6}; renderTarefas(); }
function toggleTaskDone(id){
  const t=DB.tasks.find(x=>x.id===id); if(!t)return;
  t.status = t.status==='concluida' ? 'afazer' : 'concluida';
  renderTarefas(); updateBadges(); toast(t.status==='concluida'?'Tarefa concluída ✓':'Tarefa reaberta');
}

function renderRelatorios(){

  const stages=DB.dealStages.filter(s=>!s.id.startsWith('fechado'));
  const funnelCounts=stages.map(s=>DB.deals.filter(d=>d.stage===s.id).length);

  const perdido=DB.deals.filter(d=>d.stage==='fechado_perdido').length;
  // por produto
  const prodMap={};
  DB.deals.forEach(d=>{ prodMap[d.produto]=(prodMap[d.produto]||0)+d.valor; });
  const prodEntries=Object.entries(prodMap).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const maxProd=Math.max(...prodEntries.map(e=>e[1]),1);
  // origem dos leads — agora vem da triagem (rawLeads)
  const fonteMap={};
  DB.rawLeads.forEach(l=>{ fonteMap[l.fonte]=(fonteMap[l.fonte]||0)+1; });
  const fonteColors={econodata:'#4a9fe0',apify:'#9b7fe0',comexstat:'#3fb96b'};
  const totalLeads=DB.rawLeads.length||1;
  const aprovados=DB.rawLeads.filter(l=>l.status==='aprovado').length;

    <div class="kpi-row">

      <div class="kpi"><div class="kpi-label">Ciclo médio de venda</div><div class="kpi-value">47<span style="font-size:14px;color:var(--paper-faint)"> dias</span></div><div class="kpi-delta"><span style="color:var(--paper-faint)">solicitação → fechamento</span></div></div>
      <div class="kpi blue"><div class="kpi-label">Ticket médio</div><div class="kpi-value">${brl(Math.round(DB.deals.reduce((s,d)=>s+d.valor,0)/DB.deals.length))}</div><div class="kpi-delta"><span style="color:var(--paper-faint)">por oportunidade</span></div></div>
      <div class="kpi purple"><div class="kpi-label">Taxa de aprovação (triagem)</div><div class="kpi-value">${Math.round(aprovados/totalLeads*100)}%</div><div class="kpi-delta"><span style="color:var(--paper-faint)">leads brutos → aprovados</span></div></div>
    </div>

    <div class="report-grid">

      <div class="panel">
        <div class="panel-head"><div class="panel-title"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 3H2l8 9.46V19l4 2v-8.54L22 3z"/></svg>Funil de conversão — nº de negócios por etapa</div></div>
        <div class="panel-body">
          <div class="funnel-bar">
            ${stages.map((s,i)=>{
              const c=funnelCounts[i]; const max=Math.max(...funnelCounts,1);
              return `<div class="fbar"><div class="fbar-label">${s.nome}</div><div class="fbar-track"><div class="fbar-fill" style="width:${Math.max(c/max*100,5)}%">${c}</div></div><div class="fbar-val">${c} deal(s)</div></div>`;
            }).join('')}
            <div class="fbar"><div class="fbar-label" style="color:var(--green)">Ganho</div><div class="fbar-track"><div class="fbar-fill" style="width:${Math.max(ganho/Math.max(...funnelCounts,1)*100,5)}%;background:linear-gradient(90deg,var(--green),#2d8a4f)">${ganho}</div></div><div class="fbar-val">${ganho}</div></div>
            <div class="fbar"><div class="fbar-label" style="color:var(--red)">Perdido</div><div class="fbar-track"><div class="fbar-fill" style="width:${Math.max(perdido/Math.max(...funnelCounts,1)*100,5)}%;background:linear-gradient(90deg,var(--red),#a83e32)">${perdido}</div></div><div class="fbar-val">${perdido}</div></div>
          </div>
        </div>
      </div>

      <div class="panel">
        <div class="panel-head"><div class="panel-title"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 2a10 10 0 010 20"/></svg>Origem dos leads</div></div>
        <div class="panel-body">
          <div class="donut-wrap">
            ${donutSVG(fonteMap,fonteColors,totalLeads)}
            <div class="legend">
              ${Object.entries(fonteMap).map(([k,v])=>`<div class="leg-item"><span class="leg-dot" style="background:${fonteColors[k]}"></span>${k}<span class="leg-val">${v} (${Math.round(v/totalLeads*100)}%)</span></div>`).join('')}
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head"><div class="panel-title"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><rect x="7" y="10" width="3" height="7"/><rect x="12" y="6" width="3" height="11"/><rect x="17" y="13" width="3" height="4"/></svg>Pipeline por produto (R$ total)</div></div>
      <div class="panel-body">
        <div class="bars">
          ${prodEntries.map(([prod,val])=>`
            <div class="bar-col">
              <div class="bar" style="height:${val/maxProd*100}%"><span class="bar-v">${brl(val)}</span></div>
              <div class="bar-l" style="text-align:center;max-width:70px">${prod}</div>
            </div>`).join('')}
        </div>
      </div>
    </div>`;
}
function donutSVG(map,colors,total){
  const r=52,c=2*Math.PI*r; let off=0;
  const segs=Object.entries(map).map(([k,v])=>{
    const frac=v/total, len=frac*c;
    const s=`<circle cx="70" cy="70" r="${r}" fill="none" stroke="${colors[k]}" stroke-width="18" stroke-dasharray="${len} ${c-len}" stroke-dashoffset="${-off}" transform="rotate(-90 70 70)"/>`;
    off+=len; return s;
  }).join('');
  return `<svg width="140" height="140" viewBox="0 0 140 140">${segs}<text x="70" y="66" text-anchor="middle" font-family="var(--mono)" font-size="22" font-weight="700" fill="var(--paper)">${total}</text><text x="70" y="84" text-anchor="middle" font-family="var(--mono)" font-size="9" fill="var(--paper-faint)">LEADS</text></svg>`;
}

let dragItem={type:null,id:null};
function allowDrop(e){e.preventDefault();e.currentTarget.classList.add('drag-over');}
function dragLeave(e){e.currentTarget.classList.remove('drag-over');}
function dragEnd(e){e.target.classList.remove('dragging');document.querySelectorAll('.col').forEach(c=>c.classList.remove('drag-over'));}
function dragLead(e,id){dragItem={type:'lead',id};e.target.classList.add('dragging');}
function dragDeal(e,id){dragItem={type:'deal',id};e.target.classList.add('dragging');}
function dragTask(e,id){dragItem={type:'task',id};e.target.classList.add('dragging');}
function dropLead(e,stage){e.preventDefault();e.currentTarget.classList.remove('drag-over');
  if(dragItem.type!=='lead')return;
  const l=DB.leads.find(x=>x.id===dragItem.id); if(l){l.stage=stage; renderProspeccao(); toast('Lead movido para '+DB.leadStages.find(s=>s.id===stage).nome);}
}
function dropDeal(e,stage){e.preventDefault();e.currentTarget.classList.remove('drag-over');
  if(dragItem.type!=='deal')return;
  const d=DB.deals.find(x=>x.id===dragItem.id); if(d){d.stage=stage; d.prob=DB.probByStage[stage]; renderPropostas(); toast('Oportunidade → '+DB.dealStages.find(s=>s.id===stage).nome);}
}
function dropTask(e,stage){e.preventDefault();e.currentTarget.classList.remove('drag-over');
  if(dragItem.type!=='task')return;
  const t=DB.tasks.find(x=>x.id===dragItem.id); if(t){t.status=stage; renderTarefas(); updateBadges(); toast('Tarefa movida');}
}

function searchCompanies(q){
  const box=$('#coResults'); if(!box)return;
  q=(q||'').trim();
  if(q.length<2){ box.innerHTML=''; return; }
  const ql=q.toLowerCase();
  // 1) empresas já cadastradas
  const empresas=DB.clientes.filter(c=>c.razao.toLowerCase().includes(ql)||(c.cnpj||'').includes(q))
    .map(c=>({id:c.id,nome:c.razao,cnpj:c.cnpj,tipo:'empresa'}));
  // 2) leads na triagem (status novo)
  const leads=DB.rawLeads.filter(r=>r.status==='novo'&&(r.razao.toLowerCase().includes(ql)||(r.cnpj||'').includes(q)))
    .map(r=>({id:r.id,nome:r.razao,cnpj:r.cnpj,tipo:'lead'}));
  const results=[...empresas,...leads];

  let html='';
  if(results.length){
    html=results.map(r=>`
      <div class="co-result" onclick="pickCompany('${r.tipo}',${r.id})">
        <span class="co-tag ${r.tipo}">${r.tipo}</span>
        <div class="co-result-info">
          <div class="co-result-nome">${r.nome}</div>
          <div class="co-result-sub">${r.cnpj||'sem CNPJ'}${r.tipo==='lead'?' · na triagem':''}</div>
        </div>
        ${r.tipo==='lead'?'<span style="font-size:10px;color:var(--amber-text)">aprovar e vincular →</span>':'<span style="font-size:10px;color:var(--green)">vincular →</span>'}
      </div>`).join('');
  }
  // 3) nenhum resultado → oferecer cadastro por CNPJ
  html+=`
    <div class="co-result-none">
      ${results.length?'':`<p>Nenhuma empresa ou lead encontrado para "<b>${q}</b>".</p>`}
      <div class="co-cnpj-box">
        <div class="field" style="margin:0 0 8px"><label>Cadastrar nova empresa pelo CNPJ</label>
        <input id="coCnpj" placeholder="00.000.000/0001-00" value="${/^[\d.\/-]+$/.test(q)?q:''}"></div>
        <button class="btn btn-primary btn-sm" style="width:100%" onclick="createCompanyByCnpj()">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:14px;height:14px"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.3-4.3"/></svg>
          Buscar CNPJ e cadastrar
        </button>
      </div>
    </div>`;
  box.innerHTML=html;
}
function pickCompany(tipo,id){
  if(tipo==='empresa'){

    dealPickedCompany={id:c.id,nome:c.razao,cnpj:c.cnpj,tipo:'empresa'};
  } else if(tipo==='lead'){
    // REGRA: casou com lead → aprova na hora (vira empresa, com histórico) e vincula
    const r=DB.rawLeads.find(x=>x.id===id);
    r.status='aprovado';
    const newId=promoteRawToCompany(r);

}

function winDeal(id){

function askLoseDeal(id){

function loseDeal(id){

function saveTask(id,status){

function simulateAttach(){
  const t=DB.tasks.find(x=>x.id===taskDetailId); if(!t)return;
  t.anexos=t.anexos||[];
  // simula seleção de arquivo (sem upload real)
  const exemplos=[{nome:'documento_anexado.pdf',tipo:'pdf',tam:'256 KB'},{nome:'foto_visita.jpg',tipo:'imagem',tam:'1.2 MB'},{nome:'planilha_orcamento.xlsx',tipo:'planilha',tam:'48 KB'}];
  const pick=exemplos[t.anexos.length%exemplos.length];
  t.anexos.push({...pick});
  toast('Anexo adicionado (simulado)');
  renderTaskDetailModal();

function removeAttach(idx){
  const t=DB.tasks.find(x=>x.id===taskDetailId); if(!t)return;

}
function addComment(){
  const t=DB.tasks.find(x=>x.id===taskDetailId); if(!t)return;
  const txt=($('#chatInput').value||'').trim();
  if(!txt){return;}
  t.comentarios=t.comentarios||[];

  const iso=`2026-07-29T${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
  t.comentarios.push({autor:'Tiago F.',data:iso,texto:txt});

}

/* =====================================================================
   FICHA DA EMPRESA — central de rastreabilidade (timeline + tarefas +
   oportunidades + pós-venda). Espelha o modelo Company + Activity do backend.
   ===================================================================== */
let fichaId=null, fichaTab='overview', noteType='nota', fichaKind='empresa';

// Resolve deals/tasks da empresa por nome (no protótipo o vínculo é por nome;
// no backend real seria por companyId — FK). Robusto a variações do nome.
function dealsOfCompany(razao){
  const key=razao.toLowerCase().split(' ')[0];
  return DB.deals.filter(d=>d.cliente.toLowerCase().includes(key));
}
function tasksOfCompany(razao){
  const key=razao.toLowerCase().split(' ')[0];
  return DB.tasks.filter(t=>(t.vinculoNome||'').toLowerCase().includes(key));
}
function interactionsOfCompany(id){
  return DB.interactions.filter(i=>i.companyId===id).sort((a,b)=>b.data.localeCompare(a.data));
}
function fmtDateTime(iso){
  if(!iso)return '—';
  const [d,t]=iso.split('T'); const [y,mo,day]=d.split('-');
  return `${day}/${mo}/${y.slice(2)} ${t||''}`.trim();
}

// Abre a ficha de um LEAD bruto da triagem (rawLeads). O lead ganha timeline
// e tarefas próprias, ligadas pelo companyId = 'L'+id para não colidir com empresas.
function openLeadFicha(rawId){
  fichaKind='lead'; fichaId=rawId; fichaTab='timeline'; noteType='nota';
  $('#drawerOverlay').classList.add('open');
  $('#drawer').classList.add('open');
  renderLeadFicha();
}

function openFicha(id){
  fichaKind='empresa'; fichaId=id; fichaTab='overview'; noteType='nota';
  $('#drawerOverlay').classList.add('open');
  $('#drawer').classList.add('open');
  renderFicha();
}
function closeFicha(){
  $('#drawer').classList.remove('open');
  $('#drawerOverlay').classList.remove('open');
  fichaId=null;
}
function setFichaTab(t){ fichaTab=t; fichaKind==='lead'?renderLeadFicha():renderFicha(); }
function setNoteType(t){ noteType=t; document.querySelectorAll('.note-type-btn').forEach(b=>b.classList.toggle('active',b.dataset.type===t)); }

// companyId virtual para o lead na timeline/tarefas
function leadCid(rawId){ return 90000+rawId; }
function renderLeadFicha(){
  const r=DB.rawLeads.find(x=>x.id===fichaId); if(!r)return;

  $('#drawerHead').innerHTML=`
    <div class="drawer-head-top">
      <div>
        <div class="drawer-co-name">${r.razao}</div>
        <div class="drawer-co-meta">${r.cnpj} · ${r.municipio}/${r.uf}</div>
        <div style="margin-top:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap">
          <span class="pill pill-blue">lead · triagem</span>

        </div>
      </div>

    {id:'timeline',label:'Histórico',count:inter.length},
    {id:'tarefas',label:'Tarefas',count:tasks.length},
    {id:'dados',label:'Dados do lead'},
  ];
  $('#drawerTabs').innerHTML=tabs.map(t=>`
    <button class="drawer-tab ${fichaTab===t.id?'active':''}" onclick="setFichaTab('${t.id}')">
      ${t.label}${t.count!==undefined?`<span class="tab-count">${t.count}</span>`:''}
    </button>`).join('');

  let body='';
  if(fichaTab==='timeline'){
    body=`
      <div class="add-note">
        <div class="add-note-types">
          ${['nota','ligacao','reuniao','visita','email'].map(t=>{
            const it=DB.interactionTypes[t];
            return `<button class="note-type-btn ${t===noteType?'active':''}" data-type="${t}" onclick="setNoteType('${t}')"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="${it.icon}"/></svg>${it.label}</button>`;
          }).join('')}
        </div>
        <textarea id="noteText" placeholder="Registrar contato com este lead... (mesmo antes de aprovar, o histórico fica guardado)"></textarea>

      </div>
      <div class="timeline">
        ${inter.length?inter.map(i=>tlItem(i)).join(''):'<p class="empty">Nenhum contato registrado ainda. Use o campo acima para anotar a primeira conversa.</p>'}
      </div>`;
  } else if(fichaTab==='tarefas'){
    const statusLabel={afazer:'A fazer',hoje:'Hoje',aguardando:'Aguardando',concluida:'Concluída'};
    const statusPill={afazer:'pill-gray',hoje:'pill-amber',aguardando:'pill-blue',concluida:'pill-green'};
    body=`

      ${tasks.length?tasks.map(t=>`

          <div>
            <div class="dli-title">${t.titulo}</div>
            <div class="dli-sub"><span class="task-type">${t.tipo}</span> · vence ${fmtDate(t.prazo)}</div>
          </div>
          <span class="pill ${statusPill[t.status]}">${statusLabel[t.status]}</span>
        </div>`).join(''):'<p class="empty">Nenhuma tarefa. Crie uma para não esquecer de dar sequência neste lead.</p>'}`;
  } else if(fichaTab==='dados'){
    body=`
      <dl class="kv">
        <dt>CNPJ</dt><dd>${r.cnpj}</dd>
        <dt>CNAE</dt><dd>${r.cnae} — ${r.cnaeDesc}</dd>
        <dt>Local</dt><dd>${r.municipio}/${r.uf}</dd>
        <dt>Porte</dt><dd>${r.porte}</dd>
        <dt>Situação</dt><dd>${r.situacao}</dd>
        <dt>Importador</dt><dd>${r.importador?'<span style="color:var(--green)">Sim (Comex Stat)</span>':'Não'}</dd>
        <dt>Origem</dt><dd style="text-transform:uppercase">${r.fonte}</dd>
        <dt>Score</dt><dd><span class="tier-tag tier-${tier}">${sc.score} — ${tier}</span></dd>
        <dt>Cálculo</dt><dd style="font-size:12px;color:var(--paper-dim)">${sc.reasons.join(' · ')}</dd>
      </dl>
      <div style="margin-top:20px;display:flex;gap:8px">
        <button class="btn btn-primary" onclick="approveRaw(${r.id});closeFicha();"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg>Aprovar (vira empresa)</button>

function addLeadInteraction(){
  const r=DB.rawLeads.find(x=>x.id===fichaId); if(!r)return;
  const txt=($('#noteText').value||'').trim();
  if(!txt){toast('Escreva algo para registrar');return;}
  const now=new Date();
  const iso=`2026-07-29T${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
  DB.interactions.push({id:nextId(), companyId:leadCid(r.id), tipo:noteType, autor:'Tiago F.', data:iso, texto:txt});

function openLeadTaskForm(rawId){
  const r=DB.rawLeads.find(x=>x.id===rawId); if(!r)return;

      <div class="field"><label>Tipo</label><select id="lt_tipo">${['ligacao','email','visita','followup'].map(o=>`<option>${o}</option>`).join('')}</select></div>

function saveLeadTask(rawId){

  if(!titulo){toast('Descreva a tarefa');return;}
