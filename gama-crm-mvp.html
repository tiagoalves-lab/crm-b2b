function renderFicha(){
  const c=DB.clientes.find(x=>x.id===fichaId); if(!c)return;
  const inter=interactionsOfCompany(c.id);
  const deals=dealsOfCompany(c.razao);
  const tasks=tasksOfCompany(c.razao);
  const dealsAbertas=deals.filter(d=>!d.stage.startsWith('fechado'));
  const dealsGanhas=deals.filter(d=>d.stage==='fechado_ganho');
  const statusMap={ativo:'pill-green',negociando:'pill-amber',inativo:'pill-gray'};

  // cabeçalho
  $('#drawerHead').innerHTML=`
    <div class="drawer-head-top">
      <div>
        <div class="drawer-co-name">${c.razao}</div>
        <div class="drawer-co-meta">${c.cnpj} · ${c.cidade}</div>
        <div style="margin-top:10px;display:flex;gap:8px;align-items:center">
          ${companyType(c)==='cliente'?'<span class="pill pill-green">cliente</span>':'<span class="pill pill-blue">lead</span>'}
          <span class="pill ${statusMap[c.status]}">${c.status}</span>
          <span style="font-size:12px;color:var(--paper-dim)">${c.contato} · ${c.fone}</span>
        </div>
      </div>
      <button class="btn btn-ghost btn-sm" onclick="closeFicha()">✕</button>
    </div>`;

  // abas
  const tabs=[
    {id:'overview',label:'Visão geral'},
    {id:'cadastro',label:'Dados cadastrais'},
    {id:'timeline',label:'Timeline',count:inter.length},
    {id:'tarefas',label:'Tarefas',count:tasks.length},
    {id:'negocios',label:'Oportunidades',count:deals.length},
    {id:'posvenda',label:'Pós-venda'},
  ];
  $('#drawerTabs').innerHTML=tabs.map(t=>`
    <button class="drawer-tab ${fichaTab===t.id?'active':''}" onclick="setFichaTab('${t.id}')">
      ${t.label}${t.count!==undefined?`<span class="tab-count">${t.count}</span>`:''}
    </button>`).join('');

  // corpo por aba
  let body='';
  if(fichaTab==='overview'){
    const totalGanho=dealsGanhas.reduce((s,d)=>s+d.valor,0);
    const totalAberto=dealsAbertas.reduce((s,d)=>s+d.valor,0);
    const ultima=inter[0];
    body=`
      <div class="overview-grid">
        <div class="ov-stat green"><div class="ov-stat-l">LTV (ganho)</div><div class="ov-stat-v" style="color:var(--green)">${c.ltv>0?brlFull(c.ltv):'R$ 0'}</div></div>
        <div class="ov-stat blue"><div class="ov-stat-l">Em negociação</div><div class="ov-stat-v">${totalAberto>0?brl(totalAberto):'—'}</div></div>
        <div class="ov-stat purple"><div class="ov-stat-l">Interações</div><div class="ov-stat-v">${inter.length}</div></div>
        <div class="ov-stat"><div class="ov-stat-l">Tarefas abertas</div><div class="ov-stat-v">${tasks.filter(t=>t.status!=='concluida').length}</div></div>
      </div>
      <div class="drawer-section-title">Última atividade</div>
      ${ultima?tlItem(ultima):'<p class="empty">Sem interações ainda.</p>'}
      <div class="drawer-section-title">Oportunidades ativas</div>
      ${dealsAbertas.length?dealsAbertas.map(d=>dealRow(d)).join(''):'<p style="font-size:13px;color:var(--paper-faint)">Nenhuma oportunidade aberta.</p>'}`;
  }
  else if(fichaTab==='cadastro'){
    body=renderCadastro(c);
  }
  else if(fichaTab==='timeline'){
    body=`
      <div class="add-note">
        <div class="add-note-types">
          ${['nota','ligacao','reuniao','visita','email'].map(t=>{
            const it=DB.interactionTypes[t];
            return `<button class="note-type-btn ${t===noteType?'active':''}" data-type="${t}" onclick="setNoteType('${t}')"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="${it.icon}"/></svg>${it.label}</button>`;
          }).join('')}
        </div>
        <textarea id="noteText" placeholder="Registrar interação com ${c.contato}... (o que foi conversado, próximos passos)"></textarea>
        <div class="add-note-foot"><button class="btn btn-primary btn-sm" onclick="addInteraction()">Registrar</button></div>
      </div>
      <div class="timeline">
        ${inter.length?inter.map(i=>tlItem(i)).join(''):'<p class="empty">Nenhuma interação registrada ainda.</p>'}
      </div>`;
  }
  else if(fichaTab==='tarefas'){
    const statusLabel={afazer:'A fazer',hoje:'Hoje',aguardando:'Aguardando',concluida:'Concluída'};
    const statusPill={afazer:'pill-gray',hoje:'pill-amber',aguardando:'pill-blue',concluida:'pill-green'};
    body=`
      <div class="drawer-section-title">Tarefas vinculadas a esta empresa</div>
      ${tasks.length?tasks.map(t=>`
        <div class="drawer-list-item">
          <div>
            <div class="dli-title">${t.titulo}</div>
            <div class="dli-sub"><span class="task-type">${t.tipo}</span> · vence ${fmtDate(t.prazo)}</div>
          </div>
          <span class="pill ${statusPill[t.status]}">${statusLabel[t.status]}</span>
        </div>`).join(''):'<p class="empty">Nenhuma tarefa vinculada.</p>'}`;
  }
  else if(fichaTab==='negocios'){
    body=`
      <div class="drawer-section-title">Todas as oportunidades</div>
      ${deals.length?deals.map(d=>dealRow(d,true)).join(''):'<p class="empty">Nenhuma oportunidade registrada.</p>'}`;
  }
  else if(fichaTab==='posvenda'){
    const posNotes=inter.filter(i=>i.texto.toUpperCase().includes('PÓS-VENDA')||i.texto.toUpperCase().includes('POS-VENDA'));
    body=`
      <div class="drawer-section-title">Pós-venda e relacionamento</div>
      ${dealsGanhas.length?`
        <div class="ov-stat green" style="margin-bottom:16px">
          <div class="ov-stat-l">Equipamentos adquiridos</div>
          <div style="margin-top:8px">${dealsGanhas.map(d=>`<div style="font-size:13px;padding:4px 0;border-bottom:1px solid var(--line)">🔧 ${d.produto} — <span style="font-family:var(--mono);color:var(--green)">${brlFull(d.valor)}</span></div>`).join('')}</div>
        </div>`:''}
      ${posNotes.length?`
        <div class="drawer-section-title">Notas de pós-venda</div>
        <div class="timeline">${posNotes.map(i=>tlItem(i)).join('')}</div>`:`
        <div class="posvenda-empty">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
          ${dealsGanhas.length?'Registre a primeira nota de pós-venda na aba Timeline.':'Espaço reservado para acompanhamento pós-venda.<br>Ativado quando houver uma venda fechada.'}
        </div>`}`;
  }
  $('#drawerBody').innerHTML=body;
}

/* ---- Dados cadastrais (Receita + estadual) ---- */
function renderCadastro(c){
  const cad=c.cad;
  // Bloco de busca por CNPJ (sempre visível no topo)
  const searchBox=`
    <div class="cnpj-search">
      <div class="cnpj-search-row">
        <div class="field"><label>Consultar CNPJ na Receita</label><input id="cnpjSearchInput" value="${c.cnpj||''}" placeholder="00.000.000/0001-00"></div>
        <button class="btn btn-primary" id="cnpjSearchBtn" onclick="buscarCnpj(${c.id})">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.3-4.3"/></svg>
          Buscar dados
        </button>
      </div>
      <div class="field-hint" style="margin-top:8px">Puxa razão social, CNAE, endereço e situação da base da Receita Federal (via BrasilAPI). A Inscrição Estadual é dado da SEFAZ e entra à parte.</div>
    </div>`;

  if(!cad){
    return searchBox + `
      <div class="cad-empty">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6M9 15h6M9 11h2"/></svg>
        <p>Nenhum dado cadastral ainda. Clique em <b>Buscar dados</b> acima para puxar a ficha da Receita Federal automaticamente.</p>
      </div>`;
  }

  // Bloco federal (Receita)
  const federal=`
    <div class="cad-source"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg>${cad.fonteFederal} · consultado em ${fmtDate(cad.buscadoEm)}</div>
    <div class="cad-grid">
      <div class="cad-cell"><div class="cad-k">Razão social</div><div class="cad-v">${c.razao}</div></div>
      <div class="cad-cell"><div class="cad-k">Nome fantasia</div><div class="cad-v">${cad.fantasia||'—'}</div></div>
      <div class="cad-cell"><div class="cad-k">CNPJ</div><div class="cad-v mono">${c.cnpj}</div></div>
      <div class="cad-cell"><div class="cad-k">Situação cadastral</div><div class="cad-v"><span class="badge-contrib ${cad.situacao==='ATIVA'?'sim':'nao'}">${cad.situacao}</span></div></div>
      <div class="cad-cell"><div class="cad-k">Abertura</div><div class="cad-v">${fmtDate(cad.aberturaEm)}</div></div>
      <div class="cad-cell"><div class="cad-k">Porte</div><div class="cad-v">${cad.porte}</div></div>
      <div class="cad-cell full"><div class="cad-k">Natureza jurídica</div><div class="cad-v">${cad.naturezaJuridica}</div></div>
      <div class="cad-cell full"><div class="cad-k">CNAE principal</div><div class="cad-v mono">${cad.cnaePrincipal}</div></div>
      <div class="cad-cell full"><div class="cad-k">CNAE secundários</div><div class="cnae-list">${(cad.cnaeSecundarios||[]).map(x=>`<span class="cnae-chip">${x}</span>`).join('')||'<span class="cad-v">—</span>'}</div></div>
      <div class="cad-cell full"><div class="cad-k">Endereço</div><div class="cad-v">${cad.logradouro} · ${cad.cep} · ${cad.municipioUF}</div></div>
      <div class="cad-cell"><div class="cad-k">Telefone (Receita)</div><div class="cad-v">${cad.telefoneReceita||'—'}</div></div>
      <div class="cad-cell"><div class="cad-k">E-mail (Receita)</div><div class="cad-v">${cad.emailReceita||'—'}</div></div>
    </div>`;

  // Bloco estadual (SEFAZ) — fonte diferente
  const temIE=cad.ie;
  const estadual=`
    <div class="drawer-section-title" style="margin-top:24px">Dados estaduais (SEFAZ / ICMS)</div>
    <div class="cad-source estadual"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>Fonte estadual (SINTEGRA-RS) · ${temIE?'preenchido manualmente':'preenchimento manual ou integração paga'}</div>
    ${temIE?`
    <div class="cad-grid">
      <div class="cad-cell"><div class="cad-k">Inscrição Estadual</div><div class="cad-v mono">${cad.ie}</div></div>
      <div class="cad-cell"><div class="cad-k">Situação da IE</div><div class="cad-v"><span class="badge-contrib ${cad.ieSituacao==='HABILITADA'?'sim':'nao'}">${cad.ieSituacao||'—'}</span></div></div>
      <div class="cad-cell full"><div class="cad-k">Contribuinte de ICMS</div><div class="cad-v"><span class="badge-contrib ${cad.contribuinteIcms?'sim':'nao'}">${cad.contribuinteIcms?'SIM — contribuinte':'NÃO contribuinte'}</span></div></div>
    </div>`:`
    <div class="cad-empty" style="padding:22px">
      <p style="margin-bottom:0">Inscrição Estadual não preenchida. Consulte no <b>SINTEGRA-RS</b> e registre manualmente — a Receita não fornece este dado.</p>
    </div>`}`;

  return searchBox + federal + estadual;
}

function buscarCnpj(id){
  const c=DB.clientes.find(x=>x.id===id); if(!c)return;
  const btn=$('#cnpjSearchBtn');
  const cnpj=($('#cnpjSearchInput').value||'').trim();
  if(!cnpj){toast('Informe um CNPJ');return;}
  // estado de carregando (simula o round-trip ao proxy /api/cnpj → BrasilAPI)
  btn.innerHTML=`<svg class="ic spin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 11-6.219-8.56"/></svg>Consultando...`;
  btn.disabled=true;
  setTimeout(()=>{
    const found=DB.receitaMock[cnpj];
    if(found){
      // mescla o retorno da Receita, preservando IE se já existir
      c.cad=Object.assign({}, c.cad||{}, found, {buscadoEm:'2026-07-29', ie:(c.cad&&c.cad.ie)||null, contribuinteIcms:(c.cad&&c.cad.contribuinteIcms)||false, ieSituacao:(c.cad&&c.cad.ieSituacao)||null});
      c.cnpj=cnpj;
      toast('✓ Dados da Receita carregados');
    } else {
      // simula um retorno genérico quando o CNPJ não está no mock
      c.cad=Object.assign({}, c.cad||{}, {fantasia:c.razao.split(' ')[0], naturezaJuridica:'206-2 - Sociedade Empresária Limitada', situacao:'ATIVA', aberturaEm:'2015-01-10', porte:'MÉDIO', regime:'—', cnaePrincipal:'25.11-0 / Fabricação de estruturas metálicas', cnaeSecundarios:[], logradouro:'Endereço conforme Receita', cep:'—', municipioUF:c.cidade||'RS', telefoneReceita:'—', emailReceita:'—', fonteFederal:'Receita Federal · BrasilAPI', buscadoEm:'2026-07-29', ie:(c.cad&&c.cad.ie)||null, contribuinteIcms:(c.cad&&c.cad.contribuinteIcms)||false, ieSituacao:(c.cad&&c.cad.ieSituacao)||null});
      c.cnpj=cnpj;
      toast('✓ Retorno simulado da Receita carregado');
    }
    renderFicha();
  }, 900);
}

function tlItem(i){
  const it=DB.interactionTypes[i.tipo]||DB.interactionTypes.nota;
  return `<div class="tl-item ${i.tipo}">
    <div class="tl-dot" style="border-color:${it.cor}"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="${it.cor}" stroke-width="2"><path d="${it.icon}"/></svg></div>
    <div class="tl-head">
      <span class="tl-type" style="background:${it.cor}22;color:${it.cor}">${it.label}</span>
      <span class="tl-author">${i.autor}</span>
      <span class="tl-date">${fmtDateTime(i.data)}</span>
    </div>
    <div class="tl-text">${i.texto}</div>
  </div>`;
}
function dealRow(d,showStatus){
  const stageName=DB.dealStages.find(s=>s.id===d.stage)?.nome||d.stage;
  const won=d.stage==='fechado_ganho', lost=d.stage==='fechado_perdido';
  return `<div class="drawer-list-item">
    <div>
      <div class="dli-title">🔧 ${d.produto}</div>
      <div class="dli-sub">${stageName}${d.finame?' · FINAME':''}</div>
    </div>
    <div style="text-align:right">
      <div style="font-family:var(--mono);font-size:13px;font-weight:600;color:var(--amber-text)">${brlFull(d.valor)}</div>
      ${showStatus?`<span class="pill ${won?'pill-green':lost?'pill-red':'pill-blue'}" style="margin-top:4px">${won?'Ganho':lost?'Perdido':'Aberto'}</span>`:''}
    </div>
  </div>`;
}
function addInteraction(){
  const txt=$('#noteText').value.trim();
  if(!txt){toast('Escreva algo para registrar');return;}
  const now=new Date();
  const iso=`2026-07-29T${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
  DB.interactions.push({id:nextId(),companyId:fichaId,tipo:noteType,autor:'Tiago F.',data:iso,texto:txt});
  toast('Interação registrada na timeline');
  renderFicha();
}

/* ---- CLIENTE ---- */
function openClienteForm(id=null){
  const c=id?DB.clientes.find(x=>x.id===id):{};
  openModal(id?'Editar empresa':'Nova empresa',`
    <div class="field"><label>Razão social</label><input id="c_razao" value="${c.razao||''}"></div>
    <div class="field-row">
      <div class="field"><label>CNPJ</label><input id="c_cnpj" value="${c.cnpj||''}"></div>
      <div class="field"><label>Cidade/UF</label><input id="c_cidade" value="${c.cidade||''}" placeholder="Santa Maria/RS"></div>
    </div>
    <div class="field-row">
      <div class="field"><label>Contato</label><input id="c_contato" value="${c.contato||''}"></div>
      <div class="field"><label>Telefone</label><input id="c_fone" value="${c.fone||''}"></div>
    </div>
    <div class="field-row">
      <div class="field"><label>Status</label><select id="c_status">${['ativo','negociando','inativo'].map(o=>`<option ${c.status===o?'selected':''}>${o}</option>`).join('')}</select></div>
      <div class="field"><label>LTV (R$)</label><input id="c_ltv" type="number" value="${c.ltv||0}"></div>
    </div>
    <div class="field-hint">O tipo (Lead / Cliente) é definido automaticamente: vira <b style="color:var(--green)">Cliente</b> quando há venda ganha (LTV &gt; 0).</div>
  `,`
    <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
    <button class="btn btn-primary" onclick="saveCliente(${id})">${id?'Salvar':'Criar empresa'}</button>
  `);
}
function saveCliente(id){
  const data={razao:$('#c_razao').value,cnpj:$('#c_cnpj').value,cidade:$('#c_cidade').value,contato:$('#c_contato').value,fone:$('#c_fone').value,status:$('#c_status').value,ltv:+$('#c_ltv').value||0,ultimaCompra:id?DB.clientes.find(x=>x.id===id).ultimaCompra:'—'};
  if(!data.razao){toast('Informe a razão social');return;}
  if(id){Object.assign(DB.clientes.find(x=>x.id===id),data);toast('Empresa atualizada');}
  else{DB.clientes.push({id:nextId(),...data});toast('Empresa criada');}
  closeModal();renderClientes();updateBadges();
}
function deleteCliente(id){DB.clientes=DB.clientes.filter(x=>x.id!==id);renderClientes();updateBadges();toast('Empresa excluída');}

/* ---- filtros de board ---- */
function filterLeads(v){document.querySelectorAll('#leadBoard .card').forEach(c=>{c.style.display=c.querySelector('.card-co').textContent.toLowerCase().includes(v.toLowerCase())?'':'none';});}
function filterDeals(v){document.querySelectorAll('#dealBoard .card').forEach(c=>{c.style.display=c.querySelector('.card-co').textContent.toLowerCase().includes(v.toLowerCase())?'':'none';});}

/* INIT */
renderDashboard();updateBadges();
</script>
</body>
